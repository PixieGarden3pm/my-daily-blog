
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>まいにちの記録</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf9f6;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.8;
    }
    header {
      background: #fff;
      padding: 36px 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    h1 { margin: 0; font-size: 26px; }
    header p { color: #888; font-size: 13px; }
    nav { margin-top: 20px; }
    nav a {
      color: #555;
      text-decoration: none;
      margin: 0 12px;
      font-size: 14px;
    }
    main {
      max-width: 720px;
      margin: 35px auto;
      padding: 0 18px;
    }
    article {
      background: white;
      padding: 25px;
      margin-bottom: 22px;
      border: 1px solid #eee;
      border-radius: 8px;
    }
    .date { color: #999; font-size: 12px; }
    h2 { font-size: 20px; margin: 10px 0; }
    .category {
      color: #8b7765;
      font-size: 12px;
    }
    footer {
      text-align: center;
      padding: 35px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>まいにちの記録</h1>
    <p>気ままに、日々のことを。</p>
    <nav>
      <a href="#home">HOME</a>
      <a href="#about">ABOUT</a>
    </nav>
  </header>

  <main id="home">
    <article>
      <div class="date">2026.10.31</div>
      <h2>ブログをはじめました</h2>
      <div class="category">日常</div>
      <p>
        はじめまして。<br>
        今日から少しずつ、日々の出来事や
        好きなことを記録していこうと思います。
      </p>
    </article>

    <article id="about">
      <h2>ABOUT</h2>
      <p>
        日常やおでかけ、ペットとの暮らしなどを
        気ままに綴る個人ブログです。
      </p>
    </article>
  </main>

  <footer>
    &copy; 2026 まいにちの記録
  </footer>
</body>
</html>
